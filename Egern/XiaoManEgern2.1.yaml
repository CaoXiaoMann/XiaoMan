# TG频道: https://t.me/XiaoManWangMingTianYa
# 最后更新时间: 2026-08-29 20:23
# ============================================================
# 小满的松鼠🐿️ 2.1 配置（Egern）
# —— 带详细中文注释版，适合新手参考 ——
# ============================================================

# ==================== 基础设置 ====================
ipv6: false                        # IPv6 关闭
http_port: 3080                    # HTTP 代理端口
socks_port: 3090                   # SOCKS 代理端口
allow_external_connections: true   # 允许局域网设备使用代理
vif_only: true                     # 仅虚拟网接口模式
hide_vpn_icon: false               # 显示 VPN 图标

# ==================== DNS 劫持 ====================
hijack_dns:
- '*:53'                           # 劫持所有 53 端口 DNS 请求，防止泄漏

# ==================== GeoIP / ASN 数据库 ====================
geoip_db_url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/Country-all.mmdb
asn_db_url: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

# ==================== 延迟测试 URL ====================
proxy_latency_test_url: https://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204

# ==================== 隧道模式 ====================
compat_route: false
include_all_networks: false
include_apns: false
include_cellular_services: false

# ==================== DNS 配置（国内外分流）====================
dns:
  bootstrap:                      # 引导 DNS（固定 IP，解析 DoH 服务器地址）
  - 119.29.29.29                  # 腾讯 DNS
  - 223.5.5.5                     # 阿里 DNS
  - 1.1.1.1                       # Cloudflare DNS
  upstreams:
    国内:                          # 国内 DNS（阿里 + 腾讯双备份）
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    海外:                          # 海外 DNS（Google DoH 防污染）
    - https://dns.google/dns-query
  forward:                        # 转发规则（从上到下匹配，命中即停）
  - domain_suffix:                # ① Apple 域名 → 直连（国内 CDN 快）
      match: apple.com
      value: bootstrap
      disabled: false
  - proxy_rule_set:               # ② 国外域名 → Google DoH（防 DNS 污染）
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Global/Global_All.list
      value: 海外
      disabled: false
  - domain_wildcard:              # ③ 其他域名 → 国内 DoH（速度快）
      match: '*'
      value: 国内
      disabled: false
  hosts:                          # 自定义 hosts 映射
    iosapps.itunes.apple.com:
    - hls.itunes.apple.com.mwcname.com   # iTunes 下载加速
  public_ip_lookup_url: http://whatismyip.akamai.com/

# ==================== 真实 IP 域名（不走 Fake IP）====================
real_ip_domains:
- '*.lan'                         # 局域网
- '*.push.apple.com'              # 苹果推送
- speech.platform.bing.com        # 微软语音
- doh.pub                         # 腾讯 DoH

# ============================================================
# 策略组（流量分组）
# ⬇️ 在这里添加/修改你的策略组，smart 类型会从订阅自动筛选节点
# ============================================================
policy_groups:
- select:
    name: PROXY
    policies:
    - 美国节点
    - 韩国节点
    - 新加坡节点
    - 日本节点
    - 台湾节点
    - 香港节点
    flatten: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/liuliang(3).png
    hidden: false
- select:
    name: Telegram
    policies:
    - 台湾节点
    - 香港节点
    flatten: false
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Telegram_04.png
    hidden: false
- smart:
    name: ChatGPT
    policies:
    - 韩国节点
    - 日本节点
    - 美国节点
    - 台湾节点
    flatten: false
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/ChatGPT8.png
    hidden: false
- smart:
    name: 香港节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(香港|HK|HongKong|Hong Kong|HKBN|HGC|HKIX|🇭🇰|港|穗|深港|京港)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    hidden: true
- smart:
    name: 台湾节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(台湾|TW|Taiwan|TaiWan|臺湾|台|🇹🇼|台中|台北|高雄|新竹|TPE|TWBN|TW-)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
    hidden: true
- smart:
    name: 日本节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(日本|JP|Japan|Tokyo|大阪|东京|埼玉|九州|北海道|软银|Softbank|IIJ|KDDI|NTT|🇯🇵|东京都|大阪府|大阪市|大阪城|东京塔|东京湾|TYO|KIX|HND|NRT)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    hidden: true
- smart:
    name: 新加坡节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(新加坡|SG|Singapore|Sing|SGP|🇸🇬|新加|狮城)
    block_quic: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    hidden: true
- smart:
    name: 韩国节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(韩国|(?<![A-Z])KR(?![A-Z])|Korea|South.?Korea|首尔|韩|仁川|釜山|济州|首爾|韓國|🇰🇷|SEL|ICN|PUS)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png
    hidden: true
- smart:
    name: 泰国节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(泰国|TH|Thailand|Bangkok|曼谷|🇹🇭)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Thailand.png
    hidden: true
- smart:
    name: 美国节点
    policies: []
    flatten: true
    filter: ^(?!.*0\.\d+x).*(美国|US|United States|USA|美|洛杉矶|圣何塞|达拉斯|芝加州|纽约|西雅图|弗吉尼亚|亚特兰大|芝加哥|凤凰城|波特兰|LAX|SJC|SEA|IAD|DFW|ATL|PHX|🇺🇸)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Malaysia.png
    hidden: true
- select:
    name: Final
    policies:
    - PROXY
    flatten: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bypass.png
    hidden: true

# ============================================================
# 分流规则（从上到下匹配，命中即停）
# ⬇️ 在这里添加/修改你的分流规则
# ============================================================
rules:
# ---- 广告拦截（最高优先级）----
- rule_set:
    name: AWAvenue-Ads
    match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Ads_AWAvenue.yaml
    policy: REJECT-DROP
    disabled: false
- rule_set:
    name: BlockHttpDNS
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/BlockHttpDNS/BlockHttpDNS.list
    policy: REJECT-DROP
    disabled: false
# ---- 国内直连 ----
- geoip:
    name: CN
    match: CN
    policy: DIRECT
    no_resolve: false
    disabled: false
- rule_set:
    name: China
    match: https://rule.kelee.one/Loon/China.lsr
    policy: DIRECT
    disabled: false
- rule_set:
    name: LAN
    match: https://kelee.one/Tool/Loon/Lsr/LAN_SPLITTER.lsr
    policy: DIRECT
    disabled: false
# ---- 苹果服务直连 ----
- domain_suffix:
    name: 苹果服务
    match: apple.com
    policy: DIRECT
    disabled: false
# ---- 国际应用分流 ----
- rule_set:
    name: TG
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list
    policy: Telegram
    disabled: false
- rule_set:
    name: TikTok
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/TikTok.yaml
    policy: Telegram
    disabled: false
- rule_set:
    name: GPT
    match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/OpenAI.yaml
    policy: ChatGPT
    disabled: false
- rule_set:
    name: Twitter
    match: https://github.com/Repcz/Tool/blob/X/Egern/Rules/Twitter.yaml
    policy: PROXY
    disabled: false
- rule_set:
    name: YouTube
    match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/YouTube.yaml
    policy: PROXY
    disabled: false
- rule_set:
    name: Spotify
    match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Spotify.yaml
    policy: PROXY
    disabled: false
- rule_set:
    name: WeChat
    match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/WeChat.yaml
    policy: DIRECT
    disabled: true
- rule_set:
    name: Google
    match: https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Google/
    policy: PROXY
    disabled: false
- rule_set:
    name: GitHub
    match: https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/GitHub/GitHub.list
    policy: PROXY
    disabled: false
- rule_set:
    name: Apple
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Apple/Apple.list
    policy: DIRECT
    disabled: false
# ---- 兜底规则（最后匹配）----
- default:
    name: FINAL
    policy: PROXY

# ============================================================
# URL 重写（网页跳转）
# ⬇️ 在这里添加你的 URL 重写规则
# ============================================================
url_rewrites:
- match: ^https?://(.*?L[.])?(?:glgoogle).cn
  location: https://$1google.com
  status_code: 302

# ============================================================
# 脚本（小组件等）
# ⬇️ 在这里添加你的脚本，script_url 填写脚本链接
# ============================================================
scriptings:
- generic:
    name: 网络诊断雷达pro
    script_url: https://raw.githubusercontent.com/CaoXiaoMann/XiaoMan/main/Scripts/Network-Pro/Network-Pro.js
- generic:
    name: 网络诊断雷达
    script_url: https://raw.githubusercontent.com/CaoXiaoMann/XiaoMan/main/Scripts/NetWork/Network.js

# ============================================================
# MITM 中间人解密（用于 HTTPS 抓包/重写）
# ⚠️ 证书已删除，导入后按 Egern 提示重新生成并信任 CA 证书
# ⬇️ 在 hostnames.includes 里添加需要解密的域名
# ============================================================
mitm:
  hostnames:
    includes:
    - sub.store

# ============================================================
# HTTP 抓包
# ⬇️ 在这里添加需要抓包的域名
# ============================================================
http_captures:
  includes:
  - iosapps.itunes.apple.com

# ============================================================
# 桌面小组件（主屏幕显示）
# ⬇️ 在这里添加你的小组件，script_name 对应上面 scriptings 里的 name
# ============================================================
