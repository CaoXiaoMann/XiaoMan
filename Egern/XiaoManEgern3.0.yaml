# ============================================================
# 🎉 配置到此结束
# ============================================================
# 常见问题排查：
#   • 上不了网 → 检查机场订阅是否已添加并更新（策略组是否为空）
#   • 部分网站/App 打不开 → 检查证书是否已安装并信任
#   • App 崩溃或功能异常 → 逐个关闭 modules 里对应模块排查
#   • DNS 污染 → 确认 dns.forward 兜底规则没被禁用
#   • 想加脚本 → 在 scriptings 加脚本，在 widgets 加小组件引用
#   • 想加分流规则 → 在 rules 里追加，注意顺序（先命中的优先）
#
# 更多配置说明: https://egernapp.com/zh-CN/docs/
# ============================================================
