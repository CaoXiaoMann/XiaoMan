# ============================================================
# MITM（中间人解密）
# ⚠️ 证书已移除！你需要自己在 Egern 内生成并安装：
#   Egern → 设置 → 生成 CA 证书 → 安装 → 信任
# 只有装了证书，下面的 hostnames 才会被解密，功能模块才能改写 HTTPS 内容。
# ============================================================
mitm:
  # ca_p12: "..."                   # 已移除，请自行生成
  # ca_passphrase: "..."            # 已移除
  hostnames:
    includes:                       # 需要解密（MITM）的域名
    - sub.store                     # Sub-Store 相关域名

    # 想启用其他模块（Spotify、微信、微博等），把对应域名加到这里。
    # 常见例子：
    #   "*.spotify.com"              # Spotify 去广告
    #   "*.wechat.com"               # 微信增强
    #   "*.bilibili.com"             # B 站去广告
    #   "api.spotify.com"            # Spotify API


# ============================================================
# HTTP 抓包 —— 记录这些域名的请求用于调试
# ============================================================
http_captures:
  includes:
  - iosapps.itunes.apple.com         # iTunes App 下载


# ============================================================
# 桌面小组件（Widgets）
# 说明：widget 的 script_name 必须对应上面 scriptings 里定义的 name
# 想加新的：先在 scriptings 里放脚本，再在 widgets 里引用
# ============================================================
widgets:
- name: 网络诊断雷达Pro               # 桌面显示小组件名称
  script_name: 网络诊断雷达pro        # 对应 scriptings 里的 name
  env:
    POLICY: PROXY                    # 显示哪个策略组的延迟
    YS: '1'

- name: 西安油价                     # 显示西安地区的油价
  script_name: 今日油价               # 对应 scriptings 里的 name
  env:
    SHOW_TREND: ture                 # 显示走势图（注：原作者 typo 成 ture，实际生效）
    region: shanxi-3/xian            # 地区代码（陕西-西安）
                                     # 其他常见：beijing/上海市 shanghai-shi/广东省-guangzhou

# ============================================================
